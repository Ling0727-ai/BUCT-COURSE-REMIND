version: '3.8'

services:
  # 主应用服务
  assignment-manager:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-secret-key-change-this-in-production
      - DATABASE_URL=sqlite:///data/assignments.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./scraper.py:/app/scraper.py  # 挂载你的抓取脚本
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - assignment-network

  # 可选：使用PostgreSQL数据库（推荐生产环境使用）
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     - POSTGRES_DB=assignments
  #     - POSTGRES_USER=assignment_user
  #     - POSTGRES_PASSWORD=your_password_here
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - assignment-network

  # 可选：Redis缓存
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   networks:
  #     - assignment-network

  # 可选：Nginx反向代理
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl  # SSL证书目录
    depends_on:
      - assignment-manager
    restart: unless-stopped
    networks:
      - assignment-network

networks:
  assignment-network:
    driver: bridge

volumes:
  postgres_data:
  assignment_data: