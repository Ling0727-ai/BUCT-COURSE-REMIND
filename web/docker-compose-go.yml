version: '3.8'

services:
  # Go后端服务
  backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    container_name: buct-backend-go
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/buct-course
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_for_jwt}
      - MAIL_SMTP_SERVER=${MAIL_SMTP_SERVER:-smtp.163.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_SENDER=${MAIL_SENDER:-buct_course_remind@163.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      - GIN_MODE=release
      # ECC密钥用于加密存储的密码（十进制格式的私钥）
      - ECC_PRIVATE_KEY=${ECC_PRIVATE_KEY:-}
      # RSA密钥用于前端传输加密
      - RSA_PRIVATE_KEY=${RSA_PRIVATE_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - buct-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MongoDB数据库
  mongo:
    image: mongo:6.0
    container_name: buct-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - buct-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 前端服务
  frontend:
    build:
      context: ./fronted
      dockerfile: Dockerfile
    container_name: buct-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend-go:
        condition: service_healthy
    networks:
      - buct-network

networks:
  buct-network:
    driver: bridge

volumes:
  mongo-data:
