version: '3.8'

# Go 后端版本的 docker-compose
# 启动：docker compose -f docker-compose-go.yml up -d

services:

  # ── MongoDB ──────────────────────────────────
  mongodb:
    image: mongo:6-jammy
    container_name: buct-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      # 无默认值：必须由 .env 提供，避免静默使用已知的弱口令
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME 必须在 .env 中设置}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD 必须在 .env 中设置}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-buct-course}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb_backup:/backup
    restart: unless-stopped
    networks:
      - buct-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Go 后端 ───────────────────────────────────
  backend:
    build:
      context: ./go-backend-test
      dockerfile: Dockerfile
    container_name: buct-backend-go
    ports:
      - "${GO_PORT:-5000}:5000"
    environment:
      # 运行环境
      - ENV=production
      # 统一监听 5000，与 Python 后端保持一致，nginx 无需改动即可切换
      - PORT=:5000

      # MongoDB 连接，对应 Python 的 MONGO_URI
      # 无默认值：必须由 .env 提供凭据
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE:-buct-course}?authSource=admin

      # JWT 密钥
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}

      # 邮件配置，与 Python 版本完全一致
      - MAIL_SMTP_SERVER=${MAIL_SMTP_SERVER:-smtp.163.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_SENDER=${MAIL_SENDER:-your_email@163.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - VERIFY_CODE_EXPIRE=${VERIFY_CODE_EXPIRE:-180}

      # ECC 私钥：十进制整数，对应 Python ec.derive_private_key(int(ECC_PRIVATE_KEY), ec.SECP256R1())
      # 无默认值：必须由 .env 提供，避免静默退回已知的弱密钥
      - ECC_PRIVATE_KEY=${ECC_PRIVATE_KEY:?ECC_PRIVATE_KEY 必须在 .env 中设置}
      - ECC_PUBLIC_KEY=${ECC_PUBLIC_KEY:?ECC_PUBLIC_KEY 必须在 .env 中设置}
      - RSA_KEY_SIZE=${RSA_KEY_SIZE:-2048}
      - RSA_KEY_EXPIRE_MINUTES=${RSA_KEY_EXPIRE_MINUTES:-30}
      - RSA_ENABLE=${RSA_ENABLE:-true}

      # Snowflake ID 生成器节点 ID（多实例部署时每个实例设不同值）
      - SNOWFLAKE_NODE=${SNOWFLAKE_NODE:-1}
    volumes:
      - ./go-backend-test/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - buct-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 前端 ─────────────────────────────────────
  frontend:
    build: ./fronted
    container_name: buct-frontend
    ports:
      - "${FRONTEND_PORT:-3033}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - buct-network

networks:
  buct-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
    name: buct_mongodb_data
  mongodb_config:
    driver: local
    name: buct_mongodb_config
