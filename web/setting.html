<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置 - 作业管理系统</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px 40px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header h1 {
            font-size: 2em;
            margin: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-3px);
        }

        .content {
            padding: 40px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }

        .section-title {
            font-size: 1.4em;
            color: #2c3e50;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .webhook-item {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .webhook-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
        }

        .webhook-item.active {
            border-color: #27ae60;
            background: linear-gradient(135deg, #f8fff8, #e8f5e8);
        }

        .webhook-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .webhook-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #2c3e50;
        }

        .webhook-status {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .webhook-status.active {
            background: #27ae60;
            color: white;
        }

        .webhook-status.inactive {
            background: #e74c3c;
            color: white;
        }

        .webhook-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #667eea;
            color: #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
        }

        .add-webhook-btn {
            width: 100%;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 15px;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .add-webhook-btn:hover {
            border-color: #667eea;
            color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .webhook-type-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .webhook-type {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .webhook-type:hover {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.05);
        }

        .webhook-type.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .webhook-type i {
            font-size: 1.5em;
            margin-bottom: 8px;
            display: block;
        }

        .save-section {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #f8f9fa, #ffffff);
            border-radius: 15px;
            margin-top: 30px;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: #27ae60;
            color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transform: translateX(400px);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #e74c3c;
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 1.5em;
            }

            .content {
                padding: 20px;
            }

            .section {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .webhook-type-select {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="window.history.back()">
                <i class="fas fa-arrow-left"></i>
                返回
            </button>
            <h1><i class="fas fa-cog"></i> 系统设置</h1>
        </div>

        <div class="content">
            <!-- 基础设置 -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-server"></i>
                    基础配置
                </h2>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">账号</label>
                        <input type="text" class="form-input" id="username" placeholder="请输入账号">
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input type="password" class="form-input" id="password" placeholder="请输入密码">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">后端服务器地址</label>
                    <input type="url" class="form-input" id="serverUrl" placeholder="http://localhost:8080">
                </div>
            </div>

            <!-- Webhook设置 -->
            <div class="section">
                <h2 class="section-title">
                    <i class="fas fa-bell"></i>
                    通知设置
                </h2>
                <div id="webhookList">
                    <!-- Webhook项目将通过JavaScript动态生成 -->
                </div>
                <button class="add-webhook-btn" onclick="addWebhook()">
                    <i class="fas fa-plus"></i>
                    添加新的通知方式
                </button>
            </div>

            <!-- 保存设置 -->
            <div class="save-section">
                <button class="btn btn-success" onclick="testConnection()" style="margin-right: 15px;">
                    <i class="fas fa-plug"></i>
                    测试连接
                </button>
                <button class="btn btn-primary" onclick="saveSettings()">
                    <i class="fas fa-save"></i>
                    保存设置
                </button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let webhooks = [];
        let nextWebhookId = 1;

        // Webhook类型配置
        const webhookTypes = {
            email: {
                name: '邮件',
                icon: 'fas fa-envelope',
                fields: [
                    { name: 'smtp_server', label: 'SMTP服务器', type: 'text', placeholder: 'smtp.gmail.com' },
                    { name: 'smtp_port', label: 'SMTP端口', type: 'number', placeholder: '587' },
                    { name: 'email', label: '发件邮箱', type: 'email', placeholder: 'your@gmail.com' },
                    { name: 'password', label: '邮箱密码/授权码', type: 'password', placeholder: '邮箱密码或应用密码' },
                    { name: 'to_email', label: '收件邮箱', type: 'email', placeholder: 'recipient@gmail.com' }
                ]
            },
            telegram: {
                name: 'Telegram',
                icon: 'fab fa-telegram-plane',
                fields: [
                    { name: 'bot_token', label: 'Bot Token', type: 'text', placeholder: 'your_bot_token' },
                    { name: 'chat_id', label: 'Chat ID', type: 'text', placeholder: 'your_chat_id' }
                ]
            },
            discord: {
                name: 'Discord',
                icon: 'fab fa-discord',
                fields: [
                    { name: 'webhook_url', label: 'Webhook URL', type: 'url', placeholder: 'https://discord.com/api/webhooks/...' }
                ]
            },
            slack: {
                name: 'Slack',
                icon: 'fab fa-slack',
                fields: [
                    { name: 'webhook_url', label: 'Webhook URL', type: 'url', placeholder: 'https://hooks.slack.com/services/...' }
                ]
            },
            webhook: {
                name: '自定义Webhook',
                icon: 'fas fa-code',
                fields: [
                    { name: 'url', label: 'Webhook URL', type: 'url', placeholder: 'https://your-webhook-url.com' },
                    { name: 'method', label: 'HTTP方法', type: 'select', options: ['POST', 'GET', 'PUT'], default: 'POST' },
                    { name: 'headers', label: '请求头 (JSON格式)', type: 'textarea', placeholder: '{"Content-Type": "application/json"}' },
                    { name: 'template', label: '消息模板', type: 'textarea', placeholder: '{"text": "{{message}}"}' }
                ]
            }
        };

        // 渲染Webhook列表
        function renderWebhookList() {
            const container = document.getElementById('webhookList');
            container.innerHTML = webhooks.map(webhook => {
                const typeConfig = webhookTypes[webhook.type];
                return `
                    <div class="webhook-item ${webhook.enabled ? 'active' : ''}" id="webhook-${webhook.id}">
                        <div class="webhook-header">
                            <div class="webhook-title">
                                <i class="${typeConfig.icon}"></i>
                                ${typeConfig.name} #${webhook.id}
                            </div>
                            <div class="webhook-status ${webhook.enabled ? 'active' : 'inactive'}">
                                ${webhook.enabled ? '启用' : '禁用'}
                            </div>
                            <div class="webhook-actions">
                                <button class="btn btn-small ${webhook.enabled ? 'btn-danger' : 'btn-success'}" 
                                        onclick="toggleWebhook(${webhook.id})">
                                    <i class="fas fa-${webhook.enabled ? 'pause' : 'play'}"></i>
                                    ${webhook.enabled ? '禁用' : '启用'}
                                </button>
                                <button class="btn btn-small btn-outline" onclick="testWebhook(${webhook.id})">
                                    <i class="fas fa-vial"></i>
                                    测试
                                </button>
                                <button class="btn btn-small btn-danger" onclick="deleteWebhook(${webhook.id})">
                                    <i class="fas fa-trash"></i>
                                    删除
                                </button>
                            </div>
                        </div>
                        ${renderWebhookFields(webhook)}
                    </div>
                `;
            }).join('');
        }

        // 渲染Webhook字段
        function renderWebhookFields(webhook) {
            const typeConfig = webhookTypes[webhook.type];
            return typeConfig.fields.map(field => {
                const value = webhook.config[field.name] || field.default || '';
                if (field.type === 'select') {
                    return `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <select class="form-input" onchange="updateWebhookConfig(${webhook.id}, '${field.name}', this.value)">
                                ${field.options.map(option => 
                                    `<option value="${option}" ${value === option ? 'selected' : ''}>${option}</option>`
                                ).join('')}
                            </select>
                        </div>
                    `;
                } else if (field.type === 'textarea') {
                    return `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <textarea class="form-input" rows="3" 
                                      onchange="updateWebhookConfig(${webhook.id}, '${field.name}', this.value)"
                                      placeholder="${field.placeholder}">${value}</textarea>
                        </div>
                    `;
                } else {
                    return `
                        <div class="form-group">
                            <label class="form-label">${field.label}</label>
                            <input type="${field.type}" class="form-input" 
                                   value="${value}"
                                   onchange="updateWebhookConfig(${webhook.id}, '${field.name}', this.value)"
                                   placeholder="${field.placeholder}">
                        </div>
                    `;
                }
            }).join('');
        }

        // 添加Webhook
        function addWebhook() {
            const typeSelectHtml = Object.entries(webhookTypes).map(([key, config]) => `
                <div class="webhook-type" onclick="selectWebhookType('${key}')">
                    <i class="${config.icon}"></i>
                    ${config.name}
                </div>
            `).join('');

            const overlay = document.createElement('div');
            overlay.innerHTML = `
                <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: flex; align-items: center; justify-content: center;">
                    <div style="background: white; padding: 30px; border-radius: 15px; max-width: 500px; width: 90%;">
                        <h3 style="margin-bottom: 20px; text-align: center;">选择通知类型</h3>
                        <div class="webhook-type-select">
                            ${typeSelectHtml}
                        </div>
                        <div style="text-align: center; margin-top: 20px;">
                            <button class="btn btn-outline" onclick="this.closest('div').remove()">取消</button>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);

            window.selectWebhookType = function(type) {
                const newWebhook = {
                    id: nextWebhookId++,
                    type: type,
                    enabled: true,
                    config: {}
                };
                webhooks.push(newWebhook);
                renderWebhookList();
                overlay.remove();
                delete window.selectWebhookType;
            };
        }

        // 更新Webhook配置
        function updateWebhookConfig(id, field, value) {
            const webhook = webhooks.find(w => w.id === id);
            if (webhook) {
                webhook.config[field] = value;
            }
        }

        // 切换Webhook启用状态
        function toggleWebhook(id) {
            const webhook = webhooks.find(w => w.id === id);
            if (webhook) {
                webhook.enabled = !webhook.enabled;
                renderWebhookList();
            }
        }

        // 删除Webhook
        function deleteWebhook(id) {
            if (confirm('确认删除这个通知配置吗？')) {
                webhooks = webhooks.filter(w => w.id !== id);
                renderWebhookList();
            }
        }

        // 测试Webhook
        function testWebhook(id) {
            const webhook = webhooks.find(w => w.id === id);
            if (webhook) {
                showToast('正在测试通知...', 'info');
                
                // 模拟测试请求
                setTimeout(() => {
                    const success = Math.random() > 0.3; // 70%成功率
                    if (success) {
                        showToast('测试消息发送成功！', 'success');
                    } else {
                        showToast('测试失败，请检查配置', 'error');
                    }
                }, 2000);
            }
        }

        // 测试连接
        function testConnection() {
            const serverUrl = document.getElementById('serverUrl').value;
            if (!serverUrl) {
                showToast('请先填写服务器地址', 'error');
                return;
            }

            showToast('正在测试连接...', 'info');
            
            // 模拟连接测试
            fetch(serverUrl + '/api/health')
                .then(response => {
                    if (response.ok) {
                        showToast('连接测试成功！', 'success');
                    } else {
                        showToast('服务器响应异常', 'error');
                    }
                })
                .catch(error => {
                    showToast('连接失败：' + error.message, 'error');
                });
        }

        // 保存设置
        function saveSettings() {
            const settings = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
                serverUrl: document.getElementById('serverUrl').value,
                webhooks: webhooks
            };

            // 验证必填项
            if (!settings.serverUrl) {
                showToast('请填写服务器地址', 'error');
                return;
            }

            showToast('正在保存设置...', 'info');

            // 发送到后端
            fetch('/api/settings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(settings)
            })
            .then(response => response.json())
            .then(data => {
                showToast('设置保存成功！', 'success');
                console.log('设置已保存:', data);
            })
            .catch(error => {
                showToast('保存失败：' + error.message, 'error');
                console.error('保存设置失败:', error);
            });
        }

        // 显示提示消息
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type === 'error' ? 'error' : ''}`;
            toast.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-triangle' : 'info-circle'}"></i>
                    ${message}
                </div>
            `;
            
            document.body.appendChild(toast);
            
            // 显示toast
            setTimeout(() => {
                toast.classList.add('show');
            }, 100);
            
            // 3秒后自动隐藏
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
