<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 允许缩放：禁用缩放会让视力不佳的用户无法放大页面 -->
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
    <meta name="description" content="北京化工大学课程作业与测试提醒系统，汇总所有科目作业，支持截止提醒与待办管理。">
    <meta name="theme-color" content="#3b82f6">
    <link href="/fac.svg" rel="icon" type="image/svg+xml">
    <title>北化作业管理系统</title>
    <style>
        /* 首屏加载态：JS 加载完成前避免白屏 */
        #app:empty::after {
            content: '';
            position: fixed;
            inset: 0;
            display: block;
            background:
                radial-gradient(circle at 50% 40%, rgba(59, 130, 246, 0.12) 0%, transparent 60%),
                #fafbfc;
        }

        #app:empty::before {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 28px;
            height: 28px;
            margin: -14px 0 0 -14px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: app-boot-spin 0.8s linear infinite;
            z-index: 1;
        }

        @keyframes app-boot-spin {
            to { transform: rotate(360deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            #app:empty::before { animation: none; }
        }
    </style>
</head>
<body>
<div id="app"></div>
<noscript>
    <div style="max-width: 32em; margin: 4em auto; padding: 1.5em; font-family: system-ui, sans-serif; line-height: 1.7;">
        <h1 style="font-size: 1.25em;">需要启用 JavaScript</h1>
        <p>本站是交互式作业管理界面，请在浏览器设置中启用 JavaScript 后重新打开。</p>
    </div>
</noscript>
<!-- built files will be auto injected -->
</body>
</html>
