version: '3.8'

services:
  # MongoDB 服务
  mongodb:
    image: mongo:6-jammy
    container_name: buct-mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-REDACTED_MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-REDACTED_MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-buct-course}
    volumes:
      # 数据持久化 - 使用命名卷
      - mongodb_data:/data/db
      # 配置文件持久化
      - mongodb_config:/data/configdb
      # 初始化脚本
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      # 备份目录（可选）
      - ./mongodb_backup:/backup
    restart: unless-stopped
    networks:
      - assignment-network
    # 健康检查
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 后端应用服务
  backend:
    build:
      context: ./backend
    ports:
      - "${FLASK_PORT:-5000}:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this-in-production}
      - MONGO_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-REDACTED_MONGO_USER}:${MONGO_INITDB_ROOT_PASSWORD:-REDACTED_MONGO_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE:-buct-course}?authSource=admin
      - MAIL_SMTP_SERVER=${MAIL_SMTP_SERVER:-smtp.163.com}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_SENDER=${MAIL_SENDER:-your_email@163.com}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-your_password}
      - VERIFY_CODE_EXPIRE=${VERIFY_CODE_EXPIRE:-180}
      - TEST_MODE=${TEST_MODE:-false}
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/scraper.py:/app/scraper.py  # 挂载你的抓取脚本
    depends_on:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - assignment-network

  # 前端服务
  frontend:
    build: ./fronted
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - assignment-network

networks:
  assignment-network:
    driver: bridge

volumes:
  # MongoDB 数据持久化卷
  mongodb_data:
    driver: local
    name: buct_mongodb_data
  # MongoDB 配置持久化卷  
  mongodb_config:
    driver: local
    name: buct_mongodb_config